# Jobber — Canonical States
# Source of truth for Jobber (writer) and dashboard (reader).
# Both systems MUST use these exact states.
#
# Rule: The status field in applications.md must contain EXACTLY
# one of these values (case-insensitive). No markdown bold (**),
# no dates, no extra text. Dates go in the date column.

states:
  - id: evaluated
    label: Evaluated
    aliases: [evaluada]
    description: Offer evaluated with report, pending decision
    dashboard_group: evaluated

  - id: applied
    label: Applied
    aliases: [aplicado, enviada, aplicada, sent]
    description: Application submitted
    dashboard_group: applied

  - id: responded
    label: Responded
    aliases: [respondido]
    description: Company has responded (not yet interview)
    dashboard_group: responded

  - id: interview
    label: Interview
    aliases: [entrevista]
    description: Active interview process
    dashboard_group: interview

  - id: offer
    label: Offer
    aliases: [oferta]
    description: Offer received
    dashboard_group: offer

  - id: rejected
    label: Rejected
    aliases: [rechazado, rechazada]
    description: Rejected by company
    dashboard_group: rejected

  - id: discarded
    label: Discarded
    aliases: [descartado, descartada, cerrada, cancelada]
    description: Discarded by candidate or offer closed
    dashboard_group: discarded

  - id: skip
    label: SKIP
    aliases: [no_aplicar, no aplicar, skip, monitor]
    description: Doesn't fit, don't apply
    dashboard_group: skip

  - id: hired
    label: Hired
    aliases: [contratado, contratada, hired, accepted, accept]
    description: Offer accepted, job landed!
    dashboard_group: hired

# Legal forward status transitions, keyed by the source state id → list of
# allowed target state ids (#improvement-plan A4(a)). The lifecycle is a DAG:
# an application moves forward through evaluated → applied → responded →
# interview → offer → hired, and any live state can fail (rejected/discarded)
# or be shelved (skip). A state with an EMPTY transition list is TERMINAL
# (rejected, discarded, hired): it is the funnel's end, and set-status.mjs
# refuses any change out of it unless --force records an explicit override —
# that is what prevents Rejected → Interview and Hired → Evaluated from
# validating. Live states stay free-form in both directions: a backward move
# such as Applied → Evaluated is a normal ledger CORRECTION (status-log.tsv
# records it, funnel-velocity.mjs treats it as a correction, not a fresh event)
# and is not gated. The dashboard reads this table too.
transitions:
  evaluated: [applied, responded, rejected, discarded, skip]
  applied:   [responded, interview, rejected, discarded, skip]
  responded: [interview, rejected, discarded, skip]
  interview: [offer, rejected, discarded, hired]
  offer:     [hired, rejected, discarded]
  rejected:  []
  discarded: []
  skip:      [evaluated, discarded]
  hired:     []
