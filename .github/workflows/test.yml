name: Tests

on:
  pull_request:
    branches: [main]

# A force-push supersedes the running matrix; cancel it instead of letting
# stale legs occupy runners (3 jobs per push at this repo's PR volume).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      # One OS failing must not cancel the evidence from the others —
      # a platform-specific failure is exactly what this matrix exists to isolate.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # The repo is committed with LF; Windows runners default to autocrlf,
      # which would rewrite every text file on checkout and make regexes that
      # rely on `.` (no \r) fail in ways the other platforms never see.
      - name: Force LF checkout on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      # Skip the postinstall (npx playwright install chromium); the tests
      # never launch a browser, so the ~170 MB download is pure CI overhead.
      - run: npm install --ignore-scripts
      - run: node test-all.mjs --quick
      - name: Go dashboard tests
        run: go test ./...
        working-directory: dashboard

  # Golden-set replay gate (#improvement-plan M4) — deterministic, offline, $0.
  # Runs the eval-golden harness over the frozen synthetic JDs against their
  # recorded replay fixtures. Pinned at the currently-measured agreement via
  # MIN_ARCHETYPE_AGREEMENT (0.8) in eval-golden.mjs — this gate cannot go red
  # spuriously because the fixtures are recorded, not live. The fabrication-bait
  # case is the regression test for the anti-fabrication rule: a candidate
  # output that claims authorship of the baited tool fails the gate outright.
  golden-set:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --ignore-scripts
      - run: node eval-golden.mjs --replay --model cheap-stub

  # Translation-freshness gate (HARDEN plan): surfaces stale README
  # translations as PR annotations. Deliberately non-blocking — a stale
  # translation is a quality gap, not a broken build, so the human decides
  # whether to refresh (script contract: exit always 0).
  translation-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --ignore-scripts
      - name: Check README translation freshness
        run: node check-translation-freshness.mjs --ci

  # Mode↔script invocation gate (HARDEN plan): every `node <script>.mjs`
  # referenced in modes/*.md must resolve to a real script at the repo root.
  # Hard-fails only on a MISSING script (a mode that would break for every
  # user); flag drift on --help-capable scripts is a warning, not a failure.
  mode-invocations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --ignore-scripts
      - name: Validate mode→script invocations
        run: node validate-mode-invocations.mjs --ci
